[package]
name = "dpm"
version = "1.0.0"
edition = "2024"
description = "Dusk Package Manager"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
async-recursion = "1"
base64 = "0.22"
flate2 = "1"
semver = "1"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[lib]
name = "dpm_wasm"
path = "src-rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
futures = "0.3"

[[bin]]
name = "dpm"
path = "src-rust/main.rs"
